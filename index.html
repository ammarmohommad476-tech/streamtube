<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StreamTube — a YouTube-style video platform. Watch, upload, Shorts, DMs and more." />
  <title>StreamTube — Watch. Share. Create.</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>
      <a class="brand" href="#/" data-route="home">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        </span>
        <span class="brand__text">StreamTube</span>
      </a>
    </div>

    <form class="topbar__search" id="searchForm" role="search">
      <input type="search" id="searchInput" placeholder="Search videos, creators, tags" autocomplete="off" aria-label="Search" />
      <button type="submit" class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
      </button>
    </form>

    <div class="topbar__right">
      <a class="icon-btn" href="#/upload" title="Upload">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </a>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" /></svg>
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
      </button>
      <button class="icon-btn has-badge" id="notifBtn" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 8-3 8h18s-3-1-3-8" /><path d="M13.7 21a2 2 0 01-3.4 0" /></svg>
        <span class="badge" id="notifBadge">0</span>
      </button>
      <a class="avatar-btn" href="#/profile/you" title="Your profile">
        <span class="avatar avatar--sm" id="navAvatar">Y</span>
      </a>
    </div>
  </header>

  <!-- ============ LAYOUT ============ -->
  <div class="shell">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <a class="side-link is-active" href="#/" data-route="home">
          <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21H3z" /></svg><span>Home</span>
        </a>
        <a class="side-link" href="#/shorts" data-route="shorts">
          <svg viewBox="0 0 24 24"><path d="M10 8l6 4-6 4z" /><rect x="4" y="3" width="16" height="18" rx="4" /></svg><span>Shorts</span>
        </a>
        <a class="side-link" href="#/subscriptions" data-route="subscriptions">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z" /><path d="M9 10l5 2-5 2z" /></svg><span>Subscriptions</span>
        </a>
        <a class="side-link" href="#/explore" data-route="explore">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M15 9l-2 6-4 2 2-6z" /></svg><span>Explore</span>
        </a>
        <a class="side-link" href="#/library" data-route="library">
          <svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z" /></svg><span>Library</span>
        </a>

        <div class="side-divider"></div>
        <p class="side-label">Social</p>
        <a class="side-link" href="#/messages" data-route="messages">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H7l-4 3 1-5a8 8 0 0117-6z" /></svg><span>Messages</span>
          <span class="side-pill" id="dmPill">0</span>
        </a>
        <a class="side-link" href="#/profile/you" data-route="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg><span>You</span>
        </a>
        <a class="side-link" href="#/studio" data-route="studio">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg><span>Creator Studio</span>
        </a>
        <a class="side-link" href="#/upload" data-route="upload">
          <svg viewBox="0 0 24 24"><path d="M12 17V5M7 10l5-5 5 5" /><path d="M4 19h16" /></svg><span>Upload</span>
        </a>
        <a class="side-link" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" /></svg><span>Settings</span>
        </a>
      </nav>

      <div class="sidebar__foot">
        <p class="side-label">Subscriptions</p>
        <div id="sideSubs" class="side-subs"></div>
      </div>
    </aside>

    <!-- ---------- MAIN ---------- -->
    <main class="main" id="main"></main>
  </div>

  <!-- ============ NOTIFICATION PANEL ============ -->
  <div class="panel" id="notifPanel" aria-hidden="true">
    <div class="panel__head">
      <h3>Notifications</h3>
      <button class="text-btn" id="clearNotifs">Mark all read</button>
    </div>
    <div class="panel__body" id="notifList"></div>
  </div>
  <div class="scrim" id="scrim"></div>

  <!-- ============ SHARE SHEET ============ -->
  <div class="modal" id="shareModal" aria-hidden="true">
    <div class="modal__card">
      <div class="modal__head">
        <h3>Share</h3>
        <button class="icon-btn" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal__body">
        <div class="share-row">
          <button class="share-opt" data-share="copy">
            <span class="share-opt__ico">🔗</span><span>Copy link</span>
          </button>
          <button class="share-opt" data-share="dm">
            <span class="share-opt__ico">✉️</span><span>Send in chat</span>
          </button>
          <button class="share-opt" data-share="embed">
            <span class="share-opt__ico">🧩</span><span>Embed</span>
          </button>
          <button class="share-opt" data-share="report">
            <span class="share-opt__ico">🚩</span><span>Report</span>
          </button>
        </div>
        <div class="share-link">
          <input type="text" id="shareLinkInput" readonly />
          <button class="btn btn--primary" id="shareCopyBtn">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div class="toasts" id="toasts"></div>

  <!-- Load order matters:
       data + store + ui  → app (router, shell, watch/shorts/home)
       → pages + messages (the remaining views)
       → streamtube (boot: binds views to routes, first render) -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/streamtube.js"></script>
</body>
</html>
